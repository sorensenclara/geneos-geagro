<style>
.dashboard-flex {
    display: flex;
    gap: 24px;
    align-items: flex-start;
}
.dashboard-flex .dashboard-iframe {
    flex: 0 0 25%;
    min-width: 220px;
}
.dashboard-flex .dashboard-table {
    flex: 1 1 75%;
}
@media (max-width: 900px) {
    .dashboard-flex {
        flex-direction: column;
    }
    .dashboard-flex .dashboard-iframe,
    .dashboard-flex .dashboard-table {
        flex: 1 1 100%;
        min-width: 0;
    }
}
</style>
